spring:
  application:
    name: comanda-api
  threads:
    virtual:
      enabled: true
  jackson:
    time-zone: America/Fortaleza
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/comanda}
    username: ${SPRING_DATASOURCE_USERNAME:comanda}
    password: ${SPRING_DATASOURCE_PASSWORD:comanda}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: America/Fortaleza
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
  mail:
    # deploy-vps 6.1: real host/credentials are required in prod (application-prod.yaml has no
    # default and fails boot if unset). Dev default points nowhere reachable — TransactionalMailService
    # only touches the connection on send(), never at bean creation, so local boot stays green.
    host: ${SPRING_MAIL_HOST:localhost}
    port: ${SPRING_MAIL_PORT:1025}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  # Caddy sits in front (PRD 7.3): trust its X-Forwarded-* so request.getRemoteAddr() reflects the
  # real client IP, not Caddy's — required for AuthRateLimitingFilter to key by client, not proxy.
  forward-headers-strategy: framework

app:
  domain: ${APP_DOMAIN:comanda.local}
  jwt:
    secret: ${APP_JWT_SECRET:comanda-dev-secret-change-me-comanda-dev-secret-change-me}
    access-ttl-minutes: ${APP_JWT_ACCESS_TTL_MINUTES:20}
    refresh-ttl-days: ${APP_JWT_REFRESH_TTL_DAYS:14}
  storage:
    images-dir: ${APP_STORAGE_IMAGES_DIR:data/images}
  rate-limit:
    auth:
      capacity: ${APP_RATE_LIMIT_AUTH_CAPACITY:10}
      window-seconds: ${APP_RATE_LIMIT_AUTH_WINDOW_SECONDS:60}
  admin:
    # Manual Essencial activation (PRD Seção 10, task 4.1). Empty by default: with no token
    # configured, AdminAuthFilter rejects every /api/admin/** request outright — the operator
    # surface is off unless explicitly enabled with a real secret in the deploy environment.
    token: ${APP_ADMIN_TOKEN:}
